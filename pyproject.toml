[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-osint"
version = "0.1.0"
description = "Visual OSINT investigation platform"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11.0",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]